<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6fd6">
<title>PawJam</title>
<meta name="description" content="PawJam: a monster truck rescue rally with the pups!">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7fd0ff; font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif; touch-action: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .btn { border: none; cursor: pointer; font-family: inherit; font-weight: 900; color: #fff;
         text-shadow: 0 2px 0 rgba(0,0,0,.35); border-radius: 999px;
         box-shadow: 0 6px 0 rgba(0,0,0,.3), inset 0 -4px 0 rgba(0,0,0,.15); }
  .btn:active, .btn.down { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3), inset 0 -4px 0 rgba(0,0,0,.15); }
  .go   { background: radial-gradient(circle at 50% 35%, #5fe07a, #18a33a); }
  .blue { background: radial-gradient(circle at 50% 35%, #6aa8ff, #1f5fd6); }
  .orange { background: radial-gradient(circle at 50% 35%, #ffb340, #ff6a00); }
  .purple { background: radial-gradient(circle at 50% 35%, #c58cff, #7b3fe4); }

  /* in-game controls */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end;
              padding: 0 max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); pointer-events: none; }
  #controls .grp { display: flex; gap: 12px; align-items: flex-end; }
  #controls .btn { pointer-events: auto; width: 108px; height: 108px; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #controls .btn span { font-size: 36px; line-height: 1; text-shadow: none; }
  #controls .btn.sm { width: 86px; height: 86px; font-size: 14px; }
  #controls .btn.sm span { font-size: 28px; }
  #turboBtn, #trickBtn { background: radial-gradient(circle at 50% 35%, #ffb340, #ff6a00); }
  #hornBtn, #wheelieBtn { background: radial-gradient(circle at 50% 35%, #c58cff, #7b3fe4); }
  #padBtn { background: radial-gradient(circle at 50% 35%, #6aa8ff, #1f5fd6); }
  #padBtn.hint { animation: glow .5s ease-in-out infinite alternate; }
  #padBtn.cool { opacity: .5; }
  #specialBtn { position: relative; overflow: hidden; background: #8b97a8; }
  #specialBtn .fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#ffe066, #ffb000); z-index: 0; }
  #specialBtn span, #specialBtn b { position: relative; z-index: 1; }
  #specialBtn b { font-size: 13px; }
  #specialBtn.ready { animation: glow .6s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 0 0 0 #fff36b; } to { box-shadow: 0 6px 0 rgba(0,0,0,.3), 0 0 26px 8px #fff36b; } }
  #jumpBtn  { background: radial-gradient(circle at 50% 35%, #5fe07a, #18a33a); width: 136px !important; height: 136px !important; font-size: 24px !important; }
  #jumpBtn span { font-size: 46px !important; }
  .fs-only { display: none !important; }
  body.fs .fs-only { display: flex !important; }
  body.fs .camp-only { display: none !important; }

  #topbar { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); display: none; gap: 10px; }
  #topbar .btn { width: 56px; height: 56px; font-size: 26px; background: rgba(255,255,255,.92); color: #1f3b70; text-shadow: none; }

  /* screens */
  .overlay { position: fixed; inset: 0; display: none; flex-direction: column; padding: 16px; overflow-y: auto; text-align: center; touch-action: pan-y; }
  .overlay.show { display: flex; }
  .panel { margin: auto; width: 100%; max-width: 900px; }
  .dim { background: rgba(10, 30, 80, .55); }
  h1.logo { margin: 0; font-size: clamp(64px, 16vw, 140px); color: #fff; letter-spacing: 2px; line-height: 1;
       text-shadow: 0 6px 0 #ff6a00, 0 10px 0 #b34700, 0 16px 24px rgba(0,0,0,.3); transform: rotate(-3deg); }
  h2 { margin: 0 0 10px; font-size: clamp(30px, 6vw, 48px); color: #fff; text-shadow: 0 4px 0 #1f4fa8, 0 8px 12px rgba(0,0,0,.25); }
  h3 { margin: 14px 0 8px; font-size: 22px; color: #fff; text-shadow: 0 2px 0 #1f4fa8; }
  .sub { margin: 18px 0 26px; font-size: clamp(20px, 3.5vw, 30px); color: #fff; font-weight: 900; text-shadow: 0 3px 0 #1f4fa8; }
  .big { padding: 20px 50px; font-size: 36px; }
  .row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .row .btn { padding: 16px 28px; font-size: 24px; }

  #garagePreview { height: min(24vh, 230px); width: auto; max-width: 100%; display: block; margin: 0 auto; }
  #abilityInfo { color: #fff; font-weight: 900; font-size: 17px; text-shadow: 0 2px 0 #1f4fa8; margin: 2px 0; }
  .tabs { display: inline-flex; background: rgba(255,255,255,.2); border-radius: 999px; padding: 4px; gap: 4px; margin: 4px 0 8px; }
  .tabs button { border: none; border-radius: 999px; padding: 8px 18px; font: 900 17px inherit; font-family: inherit; color: #fff; background: transparent; cursor: pointer; }
  .tabs button.on { background: #fff; color: #1f4fa8; }
  .grid { display: grid; gap: 10px; justify-content: center; }
  #pupGrid { grid-template-columns: repeat(5, 84px); }
  #truckGrid { grid-template-columns: repeat(3, 136px); }
  @media (max-width: 560px), (max-height: 760px) { #pupGrid { grid-template-columns: repeat(5, 70px); } #truckGrid { grid-template-columns: repeat(3, 112px); } .tile b { font-size: 12px; } }
  @media (min-width: 900px) and (max-height: 760px) { #pupGrid { grid-template-columns: repeat(10, 78px); } #truckGrid { grid-template-columns: repeat(6, 120px); } }
  .tile { position: relative; padding: 4px; border-radius: 18px; background: #fff; border: 5px solid #fff; cursor: pointer; font-family: inherit; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  .tile canvas { width: 100%; height: auto; display: block; }
  .tile b { display: block; font-size: 14px; color: #1f3b70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.sel { border-color: #ffcc00; box-shadow: 0 5px 0 #c48f00, 0 0 0 4px #fff36b; transform: scale(1.06); }
  .tile.sel2 { border-color: #4cc9f0; box-shadow: 0 5px 0 #1f6fd6, 0 0 0 4px #9fe3ff; }
  .tile .badge { position: absolute; top: -8px; left: -8px; width: 28px; height: 28px; border-radius: 50%; font-size: 15px; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; }
  .tile.locked canvas { filter: grayscale(1) brightness(.6); }
  .tile .lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 2px 3px #000; }
  .tile .lock span { font-size: 30px; }

  .world { margin: 6px 0 4px; }
  .world h3 { margin: 10px 0 8px; font-size: 24px; }
  .lvgrid { grid-template-columns: repeat(auto-fit, minmax(130px, 160px)); }
  .lvl { padding: 8px 6px 10px; border-radius: 20px; background: #fff; border: none; cursor: pointer; font-family: inherit; color: #1f3b70; box-shadow: 0 7px 0 var(--wc, #1f4fa8), 0 10px 16px rgba(0,0,0,.2); }
  .lvl:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--wc, #1f4fa8); }
  .lvl .ico { font-size: 36px; line-height: 1.1; }
  .lvl .num { font-size: 14px; font-weight: 900; color: #ff6a00; }
  .lvl .nm { font-size: 16px; font-weight: 900; min-height: 2.3em; display: flex; align-items: center; justify-content: center; }
  .lvl .st { font-size: 19px; letter-spacing: 2px; }
  .lvl.locked { background: #c9d3e0; color: #7a8799; box-shadow: 0 7px 0 #8a97a8; cursor: default; }
  .lvl.locked .ico { filter: grayscale(1); opacity: .5; }
  .totals { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #1f4fa8; margin-bottom: 6px; }

  .card { background: #fff; border-radius: 32px; padding: 22px 26px 26px; max-width: 560px; width: 100%; margin: auto; box-shadow: 0 10px 0 #1f4fa8, 0 20px 40px rgba(0,0,0,.35); animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h2 { color: #ff6a00; text-shadow: 0 3px 0 #ffd36b; margin: 0; }
  .card .lnum { font-size: 20px; font-weight: 900; color: #1f6fd6; }
  .card p { font-size: 22px; color: #1f3b70; font-weight: 900; margin: 10px 0 6px; }
  .card .tip { font-size: 18px; color: #4a5a78; font-weight: 700; }
  .card .goalIco { font-size: 60px; line-height: 1.1; }
  .stars { font-size: 56px; letter-spacing: 6px; margin: 4px 0; }
  .stars i { display: inline-block; font-style: normal; animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
  .stars i.off { filter: grayscale(1) opacity(.3); }
  .unlock { background: #fff6cc; border-radius: 16px; padding: 8px 12px; color: #b34700 !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topbar">
  <button class="btn" id="muteBtn" aria-label="Sound on or off">🔊</button>
  <button class="btn" id="homeBtn" aria-label="Back to levels">🏠</button>
</div>

<div id="controls">
  <div class="grp">
    <button class="btn" id="turboBtn" aria-label="Turbo"><span>🔥</span>TURBO</button>
    <button class="btn sm camp-only" id="hornBtn" aria-label="Honk the horn"><span>📯</span>HONK</button>
    <button class="btn fs-only" id="wheelieBtn" aria-label="Wheelie (hold)"><span>🛞</span>WHEELIE</button>
  </div>
  <div class="grp">
    <button class="btn sm camp-only" id="padBtn" aria-label="Pup Pad: swap pups"><span>📱</span><b id="padName">PUP PAD</b></button>
    <button class="btn sm camp-only" id="specialBtn" aria-label="Special ability"><div class="fill" id="specialFill"></div><span id="specialIco">🚨</span><b>SPECIAL</b></button>
    <button class="btn fs-only" id="trickBtn" aria-label="Trick: flip or donut"><span>🌀</span>TRICK</button>
    <button class="btn" id="jumpBtn" aria-label="Jump"><span>⬆️</span>JUMP</button>
  </div>
</div>

<div class="overlay show" id="title">
  <div class="panel">
    <h1 class="logo">PawJam</h1>
    <p class="sub">Monster truck rescue rally!</p>
    <button class="btn go big" id="playBtn">PLAY ▶</button>
  </div>
</div>

<div class="overlay dim" id="garage">
  <div class="panel">
    <h2>Garage</h2>
    <canvas id="garagePreview" width="440" height="250"></canvas>
    <div id="abilityInfo"></div>
    <div class="tabs"><button id="tabLead" class="on">⭐ Leader</button><button id="tabBack">📱 Backup</button></div>
    <div class="grid" id="pupGrid"></div>
    <h3>Truck style</h3>
    <div class="grid" id="truckGrid"></div>
    <div class="row"><button class="btn go big" id="rollBtn">Let's Roll! 🐾</button></div>
  </div>
</div>

<div class="overlay dim" id="levels">
  <div class="panel">
    <h2>Pick a Level</h2>
    <div class="totals" id="starTotal">⭐ 0</div>
    <div id="worldList"></div>
    <div class="row">
      <button class="btn orange" id="garageBtn">🚚 Garage</button>
      <button class="btn blue" id="titleBtn">🏠 Home</button>
    </div>
  </div>
</div>

<div class="overlay dim" id="intro">
  <div class="card">
    <div class="lnum" id="introNum">Level 1</div>
    <h2 id="introName">Pup Training</h2>
    <div class="goalIco" id="introIco">🐱</div>
    <p id="introGoal">Rescue 3 friends!</p>
    <p class="tip" id="introTip"></p>
    <div class="row"><button class="btn go big" id="goBtn">GO! ▶</button></div>
  </div>
</div>

<div class="overlay dim" id="win">
  <div class="card">
    <h2 id="winTitle">MISSION COMPLETE!</h2>
    <div class="stars" id="winStars"></div>
    <p id="winText"></p>
    <p class="unlock" id="winUnlock" style="display:none"></p>
    <div class="row">
      <button class="btn go" id="nextBtn">Next Level ▶</button>
      <button class="btn orange" id="againBtn2">Replay 🔁</button>
      <button class="btn blue" id="levelsBtn1">Levels</button>
    </div>
  </div>
</div>

<div class="overlay dim" id="fail">
  <div class="card">
    <h2>OH NO!</h2>
    <div class="goalIco" id="failIco">💔</div>
    <p id="failText">Out of hearts!</p>
    <p class="tip" id="failTip">Jump over rocks, fire and holes. Tap JUMP twice for a double jump!</p>
    <div class="row">
      <button class="btn go" id="againBtn">Try Again 🔁</button>
      <button class="btn blue" id="levelsBtn2">Levels</button>
    </div>
  </div>
</div>

let actx = null, muted = false, engineOsc = null, engineGain = null;
function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  engineOsc = actx.createOscillator(); engineOsc.type = 'sawtooth';
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
  engineGain = actx.createGain(); engineGain.gain.value = 0;
  engineOsc.connect(lp).connect(engineGain).connect(actx.destination);
  engineOsc.start();
}
function tone(freq, dur, type = 'square', vol = 0.15, slideTo = null, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 800, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay;
  const buf = actx.createBuffer(1, Math.ceil(actx.sampleRate * dur), actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(actx.destination); src.start(t);
}

// ---------- Drawing helpers ----------
function rrect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r, fill) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = fill; c.fill(); }
function ellipse(c, x, y, rx, ry, fill, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); c.fillStyle = fill; c.fill(); }
function poly(c, pts, fill) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); c.fillStyle = fill; c.fill(); }
function star(c, x, y, r, fill) {
  const pts = [];
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
  poly(c, pts, fill);
}
function heart(c, x, y, s, fill) {
  c.beginPath(); c.moveTo(x, y + s * 0.35);
  c.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.45, y - s * 1.0, x, y - s * 0.45);
  c.bezierCurveTo(x + s * 0.45, y - s * 1.0, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  c.fillStyle = fill; c.fill();
}
function gear(c, x, y, r, rot, fill) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.fillStyle = fill;
  for (let i = 0; i < 8; i++) { c.rotate(Math.PI / 4); c.fillRect(-r * 0.18, -r * 1.15, r * 0.36, r * 0.4); }
  circle(c, 0, 0, r * 0.85, fill); circle(c, 0, 0, r * 0.35, '#5a6470');
  c.restore();
}
function drawPaw(c, x, y, r, color) {
  ellipse(c, x, y + r * 0.25, r * 0.55, r * 0.45, color);
  circle(c, x - r * 0.55, y - r * 0.2, r * 0.22, color);
  circle(c, x - r * 0.2, y - r * 0.55, r * 0.22, color);
  circle(c, x + r * 0.2, y - r * 0.55, r * 0.22, color);
  circle(c, x + r * 0.55, y - r * 0.2, r * 0.22, color);
}

  c.lineWidth = Math.max(4, size / 5); c.strokeStyle = stroke; c.strokeText(txt, x, y);
  c.fillStyle = fill; c.fillText(txt, x, y);
}

function drawPupHead(c, p, x, y, s, blink = false) {
  c.save(); c.translate(x, y);
  const earFur = p.earFur || p.fur;
  c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = s * 0.06;
  if (p.ear === 'pointy') {
    for (const k of [-1, 1]) {
      c.beginPath(); c.moveTo(k * s * 0.85, -s * 0.15); c.lineTo(k * s * 0.75, -s * 1.15); c.lineTo(k * s * 0.2, -s * 0.7); c.closePath();
      c.fillStyle = earFur; c.fill(); c.stroke();
    }
  } else if (p.ear === 'big') {
    for (const k of [-1, 1]) {
      c.beginPath(); c.moveTo(k * s * 0.6, -s * 0.3); c.lineTo(k * s * 1.75, -s * 0.85); c.lineTo(k * s * 0.75, s * 0.25); c.closePath();
      c.fillStyle = earFur; c.fill(); c.stroke();
      poly(c, [[k * s * 0.8, -s * 0.2], [k * s * 1.5, -s * 0.7], [k * s * 0.85, s * 0.1]], '#f4a6a6');
    }
  } else if (p.ear === 'floppy') {
    for (const k of [-1, 1]) ellipse(c, k * s * 0.95, s * 0.05, s * 0.32, s * 0.62, earFur, k * 0.35);
  } else {
    for (const k of [-1, 1]) ellipse(c, k * s * 0.8, -s * 0.55, s * 0.3, s * 0.22, earFur, k * -0.5);
  }
  circle(c, 0, 0, s, p.fur); c.beginPath(); c.arc(0, 0, s, 0, Math.PI * 2); c.stroke();
  if (p.spots) { circle(c, -s * 0.55, s * 0.3, s * 0.12, '#333'); circle(c, s * 0.6, -s * 0.1, s * 0.1, '#333'); circle(c, s * 0.45, s * 0.5, s * 0.08, '#333'); }
  ellipse(c, 0, s * 0.38, s * 0.52, s * 0.38, p.muzzle);
  for (const k of [-1, 1]) {
    if (blink) {
      c.beginPath(); c.moveTo(k * s * 0.5, -s * 0.02); c.quadraticCurveTo(k * s * 0.35, s * 0.1, k * s * 0.2, -s * 0.02);
      c.strokeStyle = '#2b1a10'; c.lineWidth = s * 0.08; c.stroke();
    } else {
      ellipse(c, k * s * 0.35, -s * 0.02, s * 0.22, s * 0.25, '#fff');
      ellipse(c, k * s * 0.33, 0, s * 0.15, s * 0.18, '#5a3418');
      circle(c, k * s * 0.33, s * 0.02, s * 0.08, '#111');
      circle(c, k * s * 0.28, -s * 0.06, s * 0.06, '#fff');
    }
  }
  ellipse(c, 0, s * 0.26, s * 0.14, s * 0.1, '#222');
  c.beginPath(); c.moveTo(-s * 0.2, s * 0.45); c.quadraticCurveTo(0, s * 0.68, s * 0.2, s * 0.45);
  c.strokeStyle = '#3a1a0a'; c.lineWidth = s * 0.07; c.lineCap = 'round'; c.stroke();
  ellipse(c, 0, s * 0.58, s * 0.1, s * 0.08, '#ff7f96');
  c.beginPath(); c.arc(0, -s * 0.48, s * 0.7, Math.PI, 0); c.closePath(); c.fillStyle = p.color; c.fill();
  rrect(c, -s * 0.85, -s * 0.55, s * 1.7, s * 0.2, s * 0.1); c.fillStyle = p.dark; c.fill();
  circle(c, 0, -s * 0.82, s * 0.2, '#fff');
  drawPaw(c, 0, -s * 0.8, s * 0.15, p.dark);

}

function drawWheel(c, x, y, r, spin) {
  circle(c, x, y, r, '#1b1b1b');

function drawTruck(c, p, tk, x, y, angle, spin, squash, ex = {}) {

  if (fx.magnet) { c.save(); c.globalAlpha = 0.5; c.strokeStyle = '#4cc9f0'; c.lineWidth = 4; for (let i = 0; i < 2; i++) { c.beginPath(); c.arc(0, -80, 110 + ((t * 120 + i * 60) % 120), 0, Math.PI * 2); c.stroke(); } c.restore(); }

  c.strokeStyle = '#6b7380'; c.lineWidth = 7; c.lineCap = 'round';
  for (const wx of [-50, 50]) { c.beginPath(); c.moveTo(wx, -R); c.lineTo(wx * 0.75, -62); c.stroke(); }
  c.strokeStyle = '#ffcc00'; c.lineWidth = 4;
  for (const wx of [-50, 50]) { c.beginPath(); c.moveTo(wx - 8, -R - 6); c.lineTo(wx * 0.75 - 6, -60); c.stroke(); }
  if (ex.bed) ex.bed.slice(-4).forEach((f, i) => drawFriend(c, f, 36 + i * 13 - 10, -100 - (i % 2) * 6, 0.6, t + i));
  rrect(c, -78, -100, 156, 42, 14); c.fillStyle = body; c.fill();
  rrect(c, -78, -72, 156, 14, 7); c.fillStyle = dark; c.fill();
  rrect(c, -40, -150, 72, 56, 14); c.fillStyle = body; c.fill();
  rrect(c, -32, -143, 56, 38, 10); c.fillStyle = tk.id === 'digger' ? '#b6ffbf' : '#bfe9ff'; c.fill();
  c.save(); rrect(c, -32, -143, 56, 38, 10); c.clip();

  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.moveTo(10, -143); c.lineTo(24, -143); c.lineTo(4, -105); c.lineTo(-10, -105); c.fill();
  c.restore();
  if (pupStyle) drawPupDesign(c, p, t, fx); else drawSkin(c, tk, t);
  if (!pupStyle || !['dozer', 'plow'].includes(p.design)) {
    rrect(c, 70, -96, 12, 14, 4); c.fillStyle = tk.id === 'digger' ? tk.accent : '#fff6a8'; c.fill();
    rrect(c, 74, -64, 12, 10, 4); c.fillStyle = '#9aa1ab'; c.fill();

    c.globalAlpha = ex.alpha ?? 1;
  }
  drawWheel(c, -50, -R, R, spin);
  drawWheel(c, 50, -R, R, spin);
  if (fx.hover) { c.globalAlpha = 0.5; ellipse(c, 0, 4, 90, 8, '#bfe9ff'); c.globalAlpha = 1; }
  c.restore();
}

// ---------- World drawing ----------
const SKIES = [['#5ec8ff', '#c9f0ff'], ['#ff9a6b', '#ffe0a8'], ['#7b6bff', '#ffb3e0'], ['#0f1a45', '#3a4f9a']];
const GROUNDS = {
  bay:     { fill: '#a8743f', top: '#7a4f24', mark: 'rgba(0,0,0,.12)' },
  mud:     { fill: '#8a5a2b', top: '#5e3c1b', mark: 'rgba(0,0,0,.15)' },
  stadium: { fill: '#9a6a3a', top: '#6e4622', mark: 'rgba(0,0,0,.12)' },
  snow:    { fill: '#eef5ff', top: '#c9dcf2', mark: 'rgba(80,120,180,.15)' },
  castle:  { fill: '#a39882', top: '#7d7461', mark: 'rgba(0,0,0,.14)' },

function hill(c, par, amp, base, color, freq) {
  c.beginPath(); c.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 20) {
    const wx = x + camX * par;
    c.lineTo(x, base - amp * (0.5 + 0.5 * Math.sin(wx * freq) * Math.cos(wx * freq * 0.37)));
  }
  c.lineTo(W, H); c.closePath(); c.fillStyle = color; c.fill();
}
function drawTower(c, x, s = 1, y0 = 0) {
  c.save(); c.translate(x, y0); c.scale(s, s); c.translate(-x, 0);
  c.fillStyle = '#e8e2d0'; c.fillRect(x - 14, 220, 28, 200);
  c.fillStyle = '#d64545'; c.fillRect(x - 22, 300, 44, 14);
  circle(c, x, 205, 38, '#e8e2d0');
  c.fillStyle = '#5ec8ff'; c.beginPath(); c.arc(x, 205, 30, Math.PI, 0); c.fill();
  poly(c, [[x - 30, 175], [x, 140], [x + 30, 175]], '#ffcc00');
  circle(c, x, 140, 6, '#d64545');
  drawPaw(c, x, 222, 9, '#1f6fd6');
  c.restore();
}
function repeatX(par, span, fn) {
  const first = Math.floor((camX * par) / span) * span;
  for (let wx = first - span; wx < camX * par + W + span; wx += span) fn(wx - camX * par, wx);
}
function drawBackground(c) {
  const lv = curLevel;
  const sky = SKIES[lv.sky], night = lv.sky === 3, theme = lv.theme;
  const g = c.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]);
  c.fillStyle = sky[0]; c.fillRect(0, -offY, W, offY + 1);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (night) for (let i = 0; i < 40; i++) circle(c, (i * 137) % W, ((i * 71) % 300) - (i % 3) * offY / 3, 1.5 + (i % 3), '#fff');
  circle(c, W - 140, 110, 50, night ? '#fff9d6' : '#fff36b');
  if (night) circle(c, W - 122, 98, 44, sky[0]);
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 380 - camX * 0.08) % (W + 400) + W + 400) % (W + 400) - 200;
    const cy = 70 + (i * 53) % 120;
    c.globalAlpha = night ? 0.25 : 0.9;
    circle(c, cx, cy, 26, '#fff'); circle(c, cx + 30, cy - 10, 32, '#fff'); circle(c, cx + 62, cy, 24, '#fff');
    c.globalAlpha = 1;
  }
  if (theme === 'stadium') {
    // beach, sea and the Lookout behind the stands
    c.fillStyle = '#2f9bdc'; c.fillRect(0, 200, W, 40);
    c.fillStyle = '#f3d9a4'; c.fillRect(0, 236, W, 20);
    repeatX(0.08, 1800, sx => drawTower(c, sx + 300, 0.55, 95));
    c.fillStyle = '#39415a'; c.fillRect(0, 252, W, GROUND - 252);
    const off = -(camX * 0.3) % 24;
    for (let row = 0; row < 8; row++) for (let x = off - 24; x < W + 24; x += 24) {
      const k = Math.abs(Math.floor((x - off) / 24 + camX * 0.3 / 24) * 7 + row * 13);
      circle(c, x + (row % 2) * 12, 272 + row * 22 + Math.sin(time * 8 + k) * 2, 8, ['#ff4d6d', '#ffd23f', '#4cc9f0', '#3bceac', '#f1f1f1', '#ff8c42'][k % 6]);
    }
    c.fillStyle = '#ffcc00'; c.fillRect(0, 440, W, 10);
    repeatX(0.1, 420, sx => { c.fillStyle = '#555'; c.fillRect(sx, 60, 8, 190); rrect(c, sx - 30, 40, 68, 30, 6); c.fill(); for (let j = 0; j < 3; j++) circle(c, sx - 14 + j * 18, 55, 7, '#fffbe0'); });
  } else if (theme === 'snow') {
    repeatX(0.12, 520, sx => {
      poly(c, [[sx - 60, 420], [sx + 200, 150], [sx + 460, 420]], '#8fa6c8');
      poly(c, [[sx + 140, 212], [sx + 200, 150], [sx + 260, 212], [sx + 230, 200], [sx + 200, 222], [sx + 170, 200]], '#ffffff');
    });
    hill(c, 0.3, 60, 455, '#dfe9f7', 0.005);
    repeatX(0.45, 170, (sx, wx) => {
      const h = 70 + (Math.abs(wx) * 7 % 50);
      c.fillStyle = '#5a3a1c'; c.fillRect(sx - 4, 450, 8, 12);
      poly(c, [[sx - 30, 452], [sx, 452 - h], [sx + 30, 452]], '#2d6a4f');
      poly(c, [[sx - 14, 452 - h * 0.55], [sx, 452 - h], [sx + 14, 452 - h * 0.55]], '#fff');
    });
  } else if (theme === 'castle') {
    hill(c, 0.12, 100, 400, '#9fc99a', 0.004);
    c.fillStyle = '#b9b2a3'; c.fillRect(0, 330, W, 130);
    const off = -(camX * 0.35) % 40;
    for (let x = off - 40; x < W + 40; x += 40) c.fillRect(x, 314, 22, 18);
    c.fillStyle = 'rgba(0,0,0,.08)';
    for (let r = 0; r < 4; r++) for (let x = off - 40 + (r % 2) * 20; x < W + 40; x += 40) c.fillRect(x, 346 + r * 28, 36, 2);
    repeatX(0.35, 640, sx => {
      c.fillStyle = '#a69f90'; c.fillRect(sx - 40, 220, 80, 240);
      poly(c, [[sx - 50, 222], [sx, 140], [sx + 50, 222]], '#7b3fe4');
      c.fillStyle = '#555'; c.fillRect(sx - 2, 100, 4, 44);
      poly(c, [[sx + 2, 100], [sx + 36, 110 + Math.sin(time * 4) * 3], [sx + 2, 120]], '#ffd23f');
      rrect(c, sx - 12, 270, 24, 36, 12); c.fillStyle = '#3a2a4a'; c.fill();
      c.fillStyle = '#7b3fe4'; c.fillRect(sx - 30, 330, 16, 50); c.fillRect(sx + 14, 330, 16, 50);
      star(c, sx - 22, 348, 6, '#ffd23f'); star(c, sx + 22, 348, 6, '#ffd23f');
    });
  } else {

    hill(c, 0.35, 90, 450, night ? '#22395a' : theme === 'mud' ? '#8f7148' : '#6cc46f', 0.006);
  }
  // fence + flags
  if (theme !== 'castle') {
    c.fillStyle = '#2f3542'; c.fillRect(0, GROUND - 40, W, 8);
    const off = -(camX * 0.9) % 120;
    for (let x = off - 120; x < W + 120; x += 120) {
      c.fillStyle = '#2f3542'; c.fillRect(x, GROUND - 60, 5, 60);
      const col = ['#e0322b', '#1f6fd6', '#ffc21a', '#2fae4a'][Math.abs(Math.round((x - off) / 120 + camX * 0.9 / 120)) % 4];
      poly(c, [[x + 5, GROUND - 60], [x + 30, GROUND - 52], [x + 5, GROUND - 44]], col);
    }
  }
  const gc = GROUNDS[theme] || GROUNDS.bay;
  c.fillStyle = gc.fill; c.fillRect(0, GROUND, W, H - GROUND + 200);
  c.fillStyle = gc.top; c.fillRect(0, GROUND, W, 8);
  c.fillStyle = gc.mark;
  const toff = -camX % 60;
  if (theme === 'castle') for (let r = 0; r < 3; r++) for (let x = toff - 60 + (r % 2) * 30; x < W; x += 60) { rrect(c, x, GROUND + 14 + r * 28, 54, 24, 6); c.fill(); }
  else for (let x = toff; x < W; x += 60) { c.fillRect(x, GROUND + 30, 30, 6); c.fillRect(x + 20, GROUND + 62, 30, 6); }
  if (theme === 'snow') for (let i = 0; i < 50; i++) circle(c, ((i * 97 + time * 30 - camX * 0.2) % W + W) % W, ((i * 53 + time * (40 + i % 5 * 10)) % (H + offY)) - offY, 2 + i % 3, 'rgba(255,255,255,.85)');
  if (night) { c.fillStyle = 'rgba(10,20,60,.25)'; c.fillRect(0, -offY, W, H + offY); }
}

function bridgeDown(e) { const p = ((time + e.phase) % 4.0); return p < 2.4; }
function bridgeAngle(e) {
  const p = ((time + e.phase) % 4.0);
  if (p < 2.4) return 0;
  if (p < 2.7) return (p - 2.4) / 0.3 * 1.3;
  if (p < 3.7) return 1.3;
  return 1.3 * (1 - (p - 3.7) / 0.3);
}

function drawEntity(c, e) {
  const x = e.x - camX;
  switch (e.t) {
    case 'pit': {
      const snowy = curLevel.theme === 'snow';

      c.strokeStyle = '#333'; c.lineWidth = 3; c.beginPath(); c.moveTo(-18, -e.h / 2 - 10); c.lineTo(-4, -e.h / 2 - 6); c.moveTo(18, -e.h / 2 - 10); c.lineTo(4, -e.h / 2 - 6); c.stroke();

    case 'tires': {

        rrect(c, x + 6, ty - 14, e.w - 12, 28, 12); c.fillStyle = '#333'; c.fill();

        ellipse(c, x + e.w / 2, GROUND - 4, e.w / 2, 6, '#333');

      for (let i = 0; i < 4; i++) {
        const fx = x + 12 + i * (e.w - 24) / 3, fh = 60 + Math.sin(time * 14 + i * 2) * 14;
        c.beginPath(); c.moveTo(fx - 14, GROUND - 6); c.quadraticCurveTo(fx - 16, GROUND - fh * 0.6, fx, GROUND - fh); c.quadraticCurveTo(fx + 16, GROUND - fh * 0.6, fx + 14, GROUND - 6); c.closePath();

        c.fillStyle = (r + k) % 3 ? '#9a9486' : '#b0aa9b'; c.fill();

        c.strokeStyle = '#555'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, e.y - 40); c.lineTo(x, by + 30); c.stroke();

      c.fillStyle = '#fff'; rrect(c, x - 40, by - 24, 80, 34, 14); c.fill();
      poly(c, [[x - 6, by + 10], [x + 4, by + 22], [x + 8, by + 10]], '#fff');

      if (e.got) break;

      circle(c, x, gy, 30, 'rgba(255,255,255,.35)');
      if (e.kind === 'star') star(c, x, gy, 24, '#ffd000');

      break;
    }
    case 'scrap':

      break;
    case 'finish': {
      c.fillStyle = '#eee'; c.fillRect(x - 4, GROUND - 240, 8, 240); c.fillRect(x + 196, GROUND - 240, 8, 240);
      for (let i = 0; i < 10; i++) for (let j = 0; j < 2; j++) { c.fillStyle = (i + j) % 2 ? '#111' : '#fff'; c.fillRect(x + i * 20, GROUND - 240 + j * 20, 20, 20); }
      for (let i = 0; i < 10; i++) for (let j = 0; j < 4; j++) { c.fillStyle = (i + j) % 2 ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.35)'; c.fillRect(x + i * 20, GROUND + j * 20, 20, 20); }
      if (e.who && !e.saved) {
        const cx = x + 100;
        ellipse(c, cx, GROUND - 6, 40, 14, '#8d99a6');
        drawFriend(c, e.who, cx, GROUND - 10, 1.3, time);
        const by = GROUND - 150 + Math.sin(time * 4) * 4;
        c.fillStyle = '#fff'; rrect(c, cx - 50, by - 24, 100, 34, 14); c.fill();
        c.fillStyle = '#e0322b'; c.font = '900 22px Trebuchet MS, Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('HELP!', cx, by - 7);

    }
  }
}

// ---------- Game state ----------
let team = [PUPS[save.team[0]] || PUPS[0], PUPS[save.team[1]] || PUPS[3]];
let active = 0;
let pup = team[0];
let truckType = TRUCKS[save.truck] || TRUCKS[0];
if (!truckUnlocked(truckType)) truckType = TRUCKS[0];
let state = 'title', mode = 'campaign';
let levelIdx = 0, arenaIdx = 0, curLevel = LEVELS[0];
let camX = 0, time = 0;
let hearts = MAX_HEARTS, bones = 0, crushed = 0, rescued = 0, flips = 0, scrapCount = 0, bed = [];
let entities = [], particles = [], popups = [], flyers = [], confetti = [], waves = [];
let nextX = 0, segSinceFriend = 0, friendTarget = 3, sinceHazard = 0, wallsSpawned = 0;
let boostHeld = false, mudSlow = 0, mudLevel = 0, hurtSlow = 0, invuln = 0, shake = 0, iceT = 0;
let charge = [1, 1], abilityT = 0, abilityKey = null, swapCool = 0, slamming = false;
let ended = false, rival = null, finishX = 0, finishEnt = null, loopRide = null;
// freestyle
let fsScore = 0, fsCombo = 1, fsComboT = 0, fsTime = 0, wheelieHeld = false, wheelieAcc = 0, donutT = 0, crashT = 0, trick = { target: 0, done: 0 };

function truckWX() { return camX + truck.sx; }
function ab() { return pup.ab.key; }
function fxState() {
  const k = abilityT > 0 ? abilityKey : null;
  return { nitro: k === 'nitro', water: k === 'water', glide: k === 'glide', blade: k === 'blade', magnet: k === 'magnet' || k === 'ears', hover: k === 'hover', plow: k === 'plow', dash: k === 'dash' };
}
function invincible() { return abilityT > 0 && (abilityKey === 'nitro' || abilityKey === 'dash'); }
function speed() {
  const fx = fxState();
  const mudOk = pup.id === 'zuma' || invincible();
  return curLevel.speed * (boostHeld ? 1.5 : 1) * (mudSlow > 0 && !mudOk ? 0.6 : 1) * (hurtSlow > 0 ? 0.45 : 1)
    * (fx.nitro ? 1.6 : fx.dash ? 1.45 : 1) * (iceT > 0 && pup.id !== 'everest' ? 1.3 : 1) * (donutT > 0 ? 0.35 : 1) * (crashT > 0 ? 0.5 : 1);
}
function progress() {
  const g = curLevel.goal;
  return { rescue: rescued, crush: crushed, bones, flips, race: 0, reach: 0, freestyle: 0 }[g.type];
}

function freestyleLevel(i) {
  const a = ARENAS[i];
  return { name: a.name, ico: a.ico, theme: a.theme, sky: a.sky, speed: 330, gap: [260, 420], goal: { type: 'freestyle' },
           tip: 'TRICK in the air = flip! TRICK on the ground = donut! Hold WHEELIE for points!', w: { ramp: 3, bigRamp: 2, cars: 3, loop: 1.2, bonesHigh: 1 } };
}

function startLevel() {
  ensureAudio();
  camX = 0; entities = []; particles = []; popups = []; flyers = []; confetti = []; waves = [];
  hearts = MAX_HEARTS; bones = 0; crushed = 0; rescued = 0; flips = 0; scrapCount = 0; bed = [];
  charge = [1, 1]; abilityT = 0; abilityKey = null; swapCool = 0; slamming = false; active = 0; pup = team[0];
  invuln = 0; hurtSlow = 0; mudSlow = 0; mudLevel = 0; shake = 0; iceT = 0; ended = false; loopRide = null;
  fsScore = 0; fsCombo = 1; fsComboT = 0; fsTime = FS_TIME; wheelieHeld = false; wheelieAcc = 0; donutT = 0; crashT = 0; trick = { target: 0, done: 0 };
  segSinceFriend = 0; sinceHazard = 0; wallsSpawned = 0; friendTarget = rint(curLevel.friendEvery || [2, 3]);
  nextX = 900;
  Object.assign(truck, { y: GROUND, prevY: GROUND, vy: 0, onGround: true, jumps: maxJumps(), angle: 0, spinning: false, squash: 0, falling: false });
  rival = null; finishEnt = null;
  const g = curLevel.goal;
  if (g.type === 'race' || g.type === 'reach') {
    finishX = g.n;
    finishEnt = { t: 'finish', x: finishX, w: 200, who: g.who, saved: false };
    entities.push(finishEnt);
  }
  if (g.type === 'race') {
    const others = PUPS.filter(p => !team.includes(p));
    rival = { x: truck.sx, pup: others[Math.floor(Math.random() * others.length)], truck: TRUCKS[1], spin: 0 };
  }
  updatePadBtn();
}
function maxJumps() { return pup.id === 'liberty' ? 3 : 2; }

function rint([a, b]) { return a + Math.floor(Math.random() * (b - a + 1)); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function pickWeighted(w) {
  const keys = Object.keys(w); let total = 0;
  for (const k of keys) total += w[k];
  let r = Math.random() * total;
  for (const k of keys) { r -= w[k]; if (r <= 0) return k; }
  return keys[0];
}
function boneArc(x, n, base, peak, spread) {
  for (let i = 0; i < n; i++) { const k = n === 1 ? 0.5 : i / (n - 1); entities.push({ t: 'bone', x: x + i * spread, y: GROUND - base - peak * Math.sin(k * Math.PI), got: false }); }
  return (n - 1) * spread;
}
function carRow(x, n) {
  for (let i = 0; i < n; i++) entities.push({ t: 'car', x: x + i * 100, w: 96, h: 58, color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)], crushed: false, crushT: 0 });
  return n * 100;
}

const HAZARDS = ['boulder', 'pit', 'tires', 'fire', 'snowman', 'bridge', 'canyon'];
function spawnSegment() {
  const lv = curLevel;
  if (finishEnt && nextX > finishX - 600) { nextX = Infinity; return; }
  let type;
  const hazards = HAZARDS.filter(k => lv.w[k]);
  const forceHazard = () => hazards[Math.floor(Math.random() * hazards.length)];
  if (lv.goal.type === 'rescue' && segSinceFriend >= friendTarget) type = 'friend';
  else if (lv.goal.type === 'rescue' && segSinceFriend === friendTarget - 1 && hazards.length) type = forceHazard();
  else if (sinceHazard >= (lv.forceEvery || 2) && hazards.length) type = forceHazard();
  else type = pickWeighted(lv.w);
  if (type === 'wall' && (wallsSpawned >= (lv.maxWalls || 0) || nextX < 2500)) type = hazards.length ? forceHazard() : 'cars';
  segSinceFriend++;
  sinceHazard = hazards.includes(type) || type === 'wall' ? 0 : sinceHazard + 1;
  const hard = levelIdx >= 5;
  switch (type) {
    case 'cars': nextX += carRow(nextX, rint([1, mode === 'freestyle' ? 4 : levelIdx >= 1 ? 4 : 3])); break;
    case 'ramp': case 'bigRamp': {
      const big = type === 'bigRamp';
      entities.push({ t: 'ramp', x: nextX, w: big ? 210 : 180, h: big ? 120 : 80, launch: big ? 1350 : 1150 });
      boneArc(nextX + 260, 5, big ? 260 : 180, 160, 70);
      nextX += 180 + (big ? 720 : 560);
      if (Math.random() < 0.4) nextX += carRow(nextX, 3);
      break;
    }
    case 'canyon': {
      entities.push({ t: 'ramp', x: nextX, w: 180, h: 80, launch: 1150 });
      const gw = rint([280, 340]);
      entities.push({ t: 'pit', x: nextX + 200, w: gw, canyon: true });
      boneArc(nextX + 220, 4, 240, 80, gw / 3);
      nextX += 200 + gw + 120; break;
    }
    case 'loop': {
      nextX += 160;
      entities.push({ t: 'loop', x: nextX, r: 150, done: false });
      nextX += 340; break;
    }
    case 'mud': {
      const w = rint([200, 300]);
      entities.push({ t: 'mud', x: nextX, w, splashed: false });
      if (Math.random() < 0.5) boneArc(nextX + 40, 3, 190, 40, (w - 80) / 2);
      nextX += w; break;
    }
    case 'ice': { const w = rint([260, 420]); entities.push({ t: 'ice', x: nextX, w }); nextX += w; break; }
    case 'bonesLow': nextX += boneArc(nextX, 5, 70, 40, 60); break;
    case 'bonesHigh': nextX += boneArc(nextX, 5, 200, rnd(60, 140), 55); break;
    case 'boulder': case 'snowman': {
      const sm = type === 'snowman' || lv.theme === 'snow';
      entities.push({ t: sm ? 'snowman' : 'boulder', x: nextX, w: sm ? 60 : 72, h: sm ? 100 : 62, broken: false });
      boneArc(nextX - 60, 3, sm ? 220 : 180, 50, 96);
      if (hard && Math.random() < 0.35) { entities.push({ t: sm ? 'snowman' : 'boulder', x: nextX + 420, w: sm ? 60 : 72, h: sm ? 100 : 62, broken: false }); nextX += 420; }
      nextX += 72; break;
    }
    case 'tires': {
      entities.push({ t: 'tires', x: nextX, w: 64, h: 132, broken: false });
      boneArc(nextX - 80, 3, 280, 60, 110);
      nextX += 64; break;
    }
    case 'fire': {
      entities.push({ t: 'fire', x: nextX, w: 72, h: 70, broken: false });
      boneArc(nextX - 60, 3, 200, 50, 96);
      nextX += 72; break;
    }
    case 'wall': {
      wallsSpawned++;
      entities.push({ t: 'wall', x: nextX + 200, w: 56, h: 300, broken: false });
      nextX += 260; break;
    }
    case 'pit': {
      const w = rint([130, levelIdx >= 5 ? 200 : 170]);
      entities.push({ t: 'pit', x: nextX, w });
      boneArc(nextX - 40, 3, 190, 50, (w + 80) / 2);
      nextX += w; break;
    }
    case 'bridge': {
      entities.push({ t: 'bridge', x: nextX + 40, w: 220, phase: rnd(0, 4) });
      nextX += 300; break;
    }
    case 'goodie': {
      const kind = hearts < MAX_HEARTS && Math.random() < 0.5 ? 'heart' : 'star';
      entities.push({ t: 'goodie', kind, x: nextX + 40, y: GROUND - 250, got: false });
      nextX += 80; break;
    }
    case 'scrap': {
      for (let i = 0; i < 3; i++) entities.push({ t: 'scrap', x: nextX + i * 70, y: GROUND - 60 - (i === 1 ? 140 : 0), got: false });
      nextX += 160; break;
    }
    case 'friend': {
      segSinceFriend = 0; friendTarget = rint(lv.friendEvery || [2, 3]);
      const balloon = Math.random() < (lv.balloon || 0);
      entities.push({ t: 'friend', x: nextX + 60, y: balloon ? GROUND - 230 : GROUND - 12, balloon, color: ['#ff4d6d', '#4cc9f0', '#ffd23f', '#c77dff'][rint([0, 3])],
                      kind: FRIENDS[Math.floor(Math.random() * FRIENDS.length)], done: false });
      nextX += 120; break;
    }
  }
  nextX += rint(lv.gap) + (['pit', 'tires', 'wall', 'bridge'].includes(type) ? 80 : 0);
}

function burst(x, y, n, colors, spd = 300, grav = 900, size = 6) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.4, life: 0.6 + Math.random() * 0.5, max: 1.1, color: colors[i % colors.length], size: size * (0.6 + Math.random() * 0.8), grav });
  }
}
function popup(text, wx, y, color = '#fff', size = 40) { popups.push({ text, x: wx, y: y - 50 * popups.filter(p => p.life > 0.5).length, life: 1.1, color, size }); }
function fsAdd(pts, text, color = '#ffd000') {
  if (mode !== 'freestyle' || ended) return;
  const v = Math.round(pts * fsCombo);
  fsScore += v; fsComboT = 3;
  popup(`${text} +${v}`, truckWX(), truck.y - 230, color, 34);
  fsCombo = Math.min(3, fsCombo + 0.25);
}

// ---------- Actions ----------
function jump() {
  if (state !== 'play' || truck.falling || loopRide) return;
  if (truck.jumps > 0) {
    const iceWeak = iceT > 0 && pup.id !== 'everest' ? 0.85 : 1;
    truck.vy = (truck.onGround ? -JUMP_V : -AIR_JUMP_V) * iceWeak;
    if (!truck.onGround) truck.spinning = false;
    truck.onGround = false; truck.jumps--;
    sfx.jump();
    burst(truckWX() - 40, truck.y - 4, 8, ['#c99a6a', '#a8743f'], 160, 600, 7);
  }
}
function honk() {
  if (state !== 'play') return;
  (HORNS[truckType.id] || HORNS.pup)();
  setTimeout(sfx.bark, 700);
  popup('HONK!', truckWX() + 60, truck.y - 210, '#c58cff', 34);
}
function useSpecial() {
  if (state !== 'play' || mode !== 'campaign' || charge[active] < 1 || abilityT > 0 || ended) return;
  charge[active] = 0;
  const k = ab();
  abilityKey = k; abilityT = ABILITY_TIME[k];
  sfx.power();
  if (k !== 'stomp') popup(pup.ab.name.toUpperCase() + '!', truckWX() + 60, truck.y - 240, pup.color, 40);
  const wx = truckWX();
  if (k === 'water') {
    // blast mud and fire ahead
    for (const e of entities) {
      if (e.x > wx - 50 && e.x < wx + 700) {
        if (e.t === 'fire' && !e.broken) { e.broken = true; e.steam = 1; sfx.hiss(); popup('FIRE OUT!', e.x + 45, GROUND - 160, '#4cc9f0', 38); bones += 2; }
        if (e.t === 'mud') e.dried = true;
      }
    }
    mudLevel = 0;
  } else if (k === 'glide') {
    if (truck.onGround) { truck.onGround = false; truck.vy = -760; truck.jumps = maxJumps() - 1; }
  } else if (k === 'stomp') {
    slamming = true;
    if (truck.onGround) { truck.onGround = false; truck.vy = -800; }
    else truck.vy = Math.max(truck.vy, 300);
  }
  speak(pup.ab.name + '!');
}
function swapPup() {
  if (state !== 'play' || mode !== 'campaign' || swapCool > 0 || ended || loopRide) return;
  active = 1 - active; pup = team[active];
  abilityT = 0; abilityKey = null; slamming = false;
  truck.jumps = Math.min(truck.jumps, maxJumps());
  if (truck.onGround) truck.jumps = maxJumps();
  swapCool = 2;
  sfx.swap();
  burst(truckWX(), truck.y - 80, 26, ['#ffffff', pup.color, '#ffd23f'], 320, 200, 9);
  popup('PUP TAG!', truckWX(), truck.y - 240, '#4cc9f0', 46);
  speak(`${pup.name}, you're up!`);
  updatePadBtn();
}
function trickPress() {
  if (state !== 'play' || mode !== 'freestyle' || loopRide || crashT > 0) return;
  if (truck.onGround) { if (donutT <= 0) { donutT = 1; sfx.trick(); } }
  else { trick.target += Math.PI * 2; sfx.trick(); }
}

function hurt(label) {
  if (invuln > 0 || invincible() || ended) return false;
  hearts--; invuln = 1.6; hurtSlow = 0.6; shake = 0.4;
  sfx.bonk();
  popup(label || 'OUCH!', truckWX(), truck.y - 220, '#ff3b5c', 44);
  if (hearts <= 0) endLevel(false, 'hearts');
  return true;
}
function smash(e, label) {
  e.broken = true;
  sfx.stomp();
  const cols = e.t === 'tires' ? ['#1b1b1b', '#333', '#ffcc00'] : e.t === 'snowman' ? ['#ffffff', '#dfe9f7', '#ff8c1a'] : ['#6f7b88', '#8d99a6', '#5c6773', '#b0aa9b'];
  burst(e.x + e.w / 2, GROUND - e.h / 2, e.t === 'wall' ? 30 : 16, cols, 420, 1100, 9);
  popup(label, e.x + e.w / 2, GROUND - Math.min(e.h, 160) - 90, '#ffcc00', 44);
  bones += 2; shake = Math.max(shake, 0.2);
}
// can the current pup break this obstacle by driving into it?
function canBreak(e) {
  const k = abilityT > 0 ? abilityKey : null;
  if (k === 'nitro' || k === 'dash') return true;
  if (e.t === 'fire') return false;
  if (pup.id === 'rubble' && e.t !== 'tires') return true;   // Rubble's blade is always on for stone
  if (k === 'blade' || k === 'plow') return true;
  return false;
}

// ---------- Update ----------
function update(dt) {
  time += dt;
  if (state !== 'play') {
    camX += 120 * dt; truck.spin += 120 * dt / 34; truck.blink = (time % 3.2) < 0.12;
    truck.y = GROUND; truck.angle = 0; truck.squash = 0;
    updateFx(dt); return;
  }
  mudSlow -= dt; hurtSlow -= dt; invuln -= dt; iceT -= dt; swapCool -= dt; crashT -= dt;
  shake = Math.max(0, shake - dt);
  if (abilityT > 0) { abilityT -= dt; if (abilityT <= 0) abilityKey = null; }
  for (let i = 0; i < 2; i++) if (!(i === active && abilityT > 0)) charge[i] = Math.min(1, charge[i] + dt / 7);
  mudLevel = Math.max(0, mudLevel - dt * 0.15);
  const fx = fxState();

  if (mode === 'freestyle' && !ended) {
    fsTime -= dt;
    fsComboT -= dt; if (fsComboT <= 0) fsCombo = 1;
    if (fsTime <= 0) { fsTime = 0; endLevel(true); }
  }

  const v = ended ? curLevel.speed * 0.6 : speed();
  const prevWX = truckWX();

  // loop-the-loop ride
  if (loopRide) {
    const L = loopRide.e;
    loopRide.phi += (v * 1.7 / L.r) * dt;
    const phi = Math.min(loopRide.phi, Math.PI * 2);
    camX = L.x + L.r * Math.sin(phi) - truck.sx;
    truck.y = GROUND - L.r + L.r * Math.cos(phi);
    truck.angle = -phi;
    truck.spin += v * 1.7 * dt / 34;
    if (Math.random() < 0.5) particles.push({ x: truckWX() - 60, y: truck.y - 20, vx: 0, vy: 0, life: 0.4, max: 0.4, color: '#ffd23f', size: 7, grav: 0 });
    if (loopRide.phi >= Math.PI * 2) {
      loopRide = null; truck.angle = 0; truck.y = GROUND; camX = L.x - truck.sx + 2;
      flips++; bones += 3;
      popup('LOOP!', truckWX(), GROUND - 260, '#ffd000', 52); sfx.rescue();
      fsAdd(800, 'LOOP');
    }
    updateFx(dt); updateHud(); return;
  }

  camX += v * dt;
  const wx = truckWX();

  while (nextX < camX + W + 600) spawnSegment();
  entities = entities.filter(e => e.x + (e.w || 60) > camX - 400 || e === finishEnt);

  if (rival) {
    rival.x += curLevel.speed * curLevel.rival * dt; rival.spin += curLevel.speed * curLevel.rival * dt / 34;
    if (!ended && rival.x >= finishX + 100) endLevel(false, 'race');
  }
  if (finishEnt && !ended && wx >= finishX + 100) {
    if (finishEnt.who) { finishEnt.saved = true; flyers.push({ kind: finishEnt.who, fx: finishX + 100, fy: GROUND - 20, t: 0 }); sfx.rescue(); popup('RESCUED!', finishX + 100, GROUND - 200, '#2fae4a', 50); }
    endLevel(true);
  }

  // ground: ramps, pits, bridges, loops
  let rampY = null, rampAngle = 0, overPit = null;
  for (const e of entities) {
    if (e.t === 'ramp') {
      if (wx >= e.x && wx <= e.x + e.w) { rampY = GROUND - e.h * (wx - e.x) / e.w; rampAngle = -Math.atan2(e.h, e.w); }
      if (truck.onGround && prevWX <= e.x + e.w && wx > e.x + e.w) {
        truck.onGround = false; truck.vy = -e.launch; truck.jumps = maxJumps() - 1;
        truck.spinning = true; truck.spinRate = -Math.PI * 2 / (2 * e.launch / GRAV * 0.92);
        sfx.flip();
      }
    } else if (e.t === 'pit' && wx > e.x + 22 && wx < e.x + e.w - 22) overPit = e;
    else if (e.t === 'bridge' && wx > e.x - 80 && wx < e.x + e.w) {
      const p = (time + e.phase) % 4.0;   // the bridge waits while you cross
      if (truck.onGround && p > 2.1 && p < 2.4) e.phase -= p - 2.1;
      if (wx > e.x + 18 && wx < e.x + e.w - 18 && bridgeAngle(e) > 0.35) overPit = e;
    }
    else if (e.t === 'loop' && !e.done && truck.onGround && prevWX < e.x && wx >= e.x) {
      e.done = true; loopRide = { e, phi: 0 }; camX = e.x - truck.sx; sfx.flip(); return;
    }
  }
  if (overPit && !truck.falling && (fx.hover || fx.nitro)) overPit = null;   // hover & nitro skim over water

  truck.prevY = truck.y;
  if (truck.onGround) {
    if (overPit) { truck.onGround = false; truck.vy = 50; truck.falling = true; truck.jumps = 0; sfx.fall(); }
    else {
      truck.y = rampY !== null ? rampY : GROUND;
      let target = rampY !== null ? rampAngle : 0;
      if (mode === 'freestyle' && wheelieHeld && rampY === null) target = -0.5;
      truck.angle += (target - truck.angle) * Math.min(1, dt * 12);
    }
  }
  if (!truck.onGround) {
    let g = GRAV * (pup.id === 'skye' ? 0.85 : 1);
    if (slamming && truck.vy > -200) { truck.vy = Math.max(truck.vy, 1500); g = 0; }
    truck.vy += g * dt;
    if (fx.glide && truck.vy > 120) truck.vy = 120;
    truck.y += truck.vy * dt;
    if (truck.spinning) truck.angle += truck.spinRate * dt;
    else truck.angle += (Math.max(-0.35, Math.min(0.3, truck.vy * 0.0004)) - truck.angle) * Math.min(1, dt * 6);
    if (trick.done < trick.target) trick.done = Math.min(trick.target, trick.done + Math.PI * 2 / 0.5 * dt);
    if (overPit && truck.y > GROUND + 4) truck.falling = true;
    if (truck.falling) {
      if (truck.y > GROUND + 160) {
        const pit = entities.find(e => (e.t === 'pit' || e.t === 'bridge') && wx > e.x - 40 && wx < e.x + e.w + 60);
        burst(wx, GROUND + 70, 18, ['#4a90e2', '#ffffff', '#9fd0ff'], 300, 800, 7);
        sfx.splash();
        hurt('SPLASH!');
        if (pit) camX = pit.x + pit.w + 30 - truck.sx;
        Object.assign(truck, { y: GROUND - 220, vy: -300, falling: false, spinning: false, angle: 0, jumps: 1 });
        trick = { target: 0, done: 0 }; slamming = false;
      }
    } else {
      const floor = rampY !== null ? rampY : GROUND;
      if (truck.y >= floor && truck.vy > 0 && !overPit) {
        const hard = truck.vy;
        if (truck.spinning) {
          flips++; bones += 3;
          popup('BACKFLIP!', wx, truck.y - 220, '#ffcc00', 48);
          if (curLevel.goal.type === 'flips') sfx.rescue();
          fsAdd(500, 'BACKFLIP');
        }
        if (mode === 'freestyle' && trick.target > 0) {
          if (trick.target - trick.done > 0.6) { crash(); }
          else { const n = Math.round(trick.target / (Math.PI * 2)); fsAdd(350 * n * (n > 1 ? 1.5 : 1), n > 1 ? `${n}x FLIP` : 'FLIP'); }
        }
        trick = { target: 0, done: 0 };
        if (slamming) { slamming = false; dinoQuake(wx); }
        truck.y = floor; truck.onGround = true; truck.jumps = maxJumps();
        truck.spinning = false; truck.angle = 0; truck.vy = 0;
        if (hard > 500) {
          truck.squash = 1; sfx.land();
          burst(wx - 50, GROUND - 4, 10, ['#c99a6a', '#a8743f', '#8a5a2b'], 220, 700, 8);
          burst(wx + 50, GROUND - 4, 10, ['#c99a6a', '#a8743f', '#8a5a2b'], 220, 700, 8);
          if (mode === 'freestyle' && hard > 1300) fsAdd(300, 'BIG AIR', '#4cc9f0');
        }
      }
    }
  }
  truck.squash = Math.max(0, truck.squash - dt * 4);
  truck.spin += v * dt / 34;
  truck.blink = (time % 3.2) < 0.12;

  // freestyle ground tricks
  if (mode === 'freestyle') {
    if (donutT > 0) {
      donutT -= dt;
      if (Math.random() < 0.8) burst(wx + (Math.random() - 0.5) * 120, GROUND - 4, 1, ['#c99a6a', '#a8743f'], 260, 700, 8);
      if (donutT <= 0) fsAdd(400, 'DONUT', '#ff8c42');
    }
    if (wheelieHeld && truck.onGround && donutT <= 0) {
      wheelieAcc += dt;
      if (wheelieAcc >= 1) { wheelieAcc = 0; fsAdd(100, 'WHEELIE', '#5fe07a'); }
    } else wheelieAcc = 0;
  }

  // collisions (truck box: wx±75, truck.y-150..truck.y)
  const top = truck.y - 150, L = wx - 75, Rt = wx + 75;
  const pull = fx.magnet ? 360 : 0;
  for (const e of entities) {
    if (pull && (e.t === 'bone' || e.t === 'scrap' || e.t === 'goodie') && !e.got && e.x > wx - 100 && e.x < wx + pull + 200) {
      e.x += (wx - e.x) * Math.min(1, dt * 5); e.y += (truck.y - 80 - e.y) * Math.min(1, dt * 5);
    }
    if (e.t === 'car') {
      if (e.crushed) { e.crushT += dt; continue; }
      if (Rt > e.x && L < e.x + e.w && truck.y > GROUND - e.h && !truck.falling) {
        e.crushed = true; crushed++; bones += 1;
        sfx.crunch();
        burst(e.x + e.w / 2, GROUND - 30, 14, [e.color, '#cdeeff', '#ffffff', '#ffcc00'], 380, 1000, 7);
        popup(['CRUSH!', 'SMASH!', 'CRUNCH!', 'WOW!'][Math.floor(Math.random() * 4)], e.x + e.w / 2, GROUND - 150, '#ff4d6d', 42);
        fsAdd(100, 'CRUSH', '#ff4d6d');
        if (truck.onGround) { truck.onGround = false; truck.vy = -420; truck.jumps = maxJumps() - 1; }
        else if (truck.vy > 0) truck.vy = -420;
      }
    } else if (['boulder', 'tires', 'snowman', 'wall', 'fire'].includes(e.t) && !e.broken) {
      const inset = e.t === 'fire' ? 42 : 16;   // forgiving hitboxes
      if (Rt - inset > e.x && L + inset < e.x + e.w) {
        const objTop = GROUND - e.h + (e.t === 'fire' ? 30 : 0);
        if (e.t !== 'fire' && e.t !== 'wall' && truck.vy > 0 && truck.prevY <= objTop + 10 && truck.y >= objTop) {
          smash(e, 'STOMP!');
          truck.y = objTop; truck.vy = -650; truck.jumps = maxJumps() - 1; truck.spinning = false; truck.angle = 0;
          if (slamming) { slamming = false; dinoQuake(wx); }
        } else if (truck.y > objTop + 14) {
          if (canBreak(e)) smash(e, e.t === 'wall' ? 'CRASH THROUGH!' : 'POW!');
          else {
            e.broken = true;
            if (e.t === 'fire') { e.steam = 0; burst(e.x + e.w / 2, GROUND - 40, 12, ['#ff6a00', '#ffe066'], 300, 400, 7); }
            else burst(e.x + e.w / 2, GROUND - e.h / 2, 10, ['#6f7b88', '#8d99a6', '#1b1b1b'], 300, 1000, 8);
            hurt(e.t === 'fire' ? 'HOT HOT!' : e.t === 'wall' ? 'BONK!' : 'OUCH!');
          }
        }
      }
    } else if (e.t === 'fire' && e.broken && e.steam > 0) {
      e.steam -= dt * 0.8;
    } else if (e.t === 'bone' && !e.got) {
      if (e.x > L - 15 && e.x < Rt + 15 && e.y > top - 20 && e.y < truck.y) {
        e.got = true; bones++; sfx.bone();
        charge[active] = Math.min(1, charge[active] + 0.04);
        burst(e.x, e.y, 6, ['#fff36b', '#ffffff'], 200, 300, 5);
        if (mode === 'freestyle') fsScore += 10;
      }
    } else if (e.t === 'scrap' && !e.got) {
      if (e.x > L - 15 && e.x < Rt + 15 && e.y > top - 20 && e.y < truck.y) {
        e.got = true; sfx.scrap(); bones += 1;
        burst(e.x, e.y, 6, ['#9aa5b5', '#ffffff'], 200, 300, 5);
        if (pup.id === 'rocky') {
          scrapCount++;
          if (scrapCount >= 3) {
            scrapCount = 0;
            if (hearts < MAX_HEARTS) { hearts++; sfx.heart(); popup('TRUCK FIXED! +1 ❤', wx, truck.y - 230, '#2fae4a', 36); }
            else popup('RECYCLED!', wx, truck.y - 230, '#2fae4a', 36);
          }
        }
      }
    } else if (e.t === 'goodie' && !e.got) {
      if (e.x > L - 20 && e.x < Rt + 20 && e.y > top - 30 && e.y < truck.y) {
        e.got = true;
        if (e.kind === 'heart') { hearts = Math.min(MAX_HEARTS, hearts + 1); sfx.heart(); popup('+1 HEART!', e.x, e.y - 60, '#ff3b5c', 40); }
        else { charge = [1, 1]; sfx.power(); popup('SPECIAL READY!', e.x, e.y - 60, '#ffd000', 40); }
        burst(e.x, e.y, 14, ['#ffd000', '#ff3b5c', '#ffffff'], 260, 300, 6);
      }
    } else if (e.t === 'mud') {
      if (truck.onGround && wx > e.x && wx < e.x + e.w && !e.dried) {
        mudSlow = 0.25;
        if (pup.id !== 'zuma') mudLevel = 1;
        if (Math.random() < 0.6) burst(wx + (Math.random() - 0.5) * 100, GROUND - 4, 2, ['#5a3a1c', '#7a4f28'], 260, 900, 8);
        if (!e.splashed) { e.splashed = true; sfx.splash(); popup(pup.id === 'zuma' ? 'ZOOM!' : 'SPLASH!', wx, GROUND - 200, '#7a4f28', 44); }
      }
    } else if (e.t === 'ice') {
      if (truck.onGround && wx > e.x && wx < e.x + e.w) {
        iceT = 0.2;
        if (pup.id !== 'everest' && Math.random() < 0.4) particles.push({ x: wx - 50, y: GROUND - 6, vx: -100, vy: -40, life: 0.4, max: 0.4, color: '#e6f6ff', size: 6, grav: 200 });
        if (!e.slid) { e.slid = true; popup(pup.id === 'everest' ? 'GRIP!' : 'WHEEE!', wx, GROUND - 200, '#4cc9f0', 40); }
      }
    } else if (e.t === 'friend' && !e.done) {
      const fy = e.balloon ? e.y - 20 : GROUND - 30;
      const near = fx.magnet && abilityKey === 'ears' && e.x > wx && e.x < wx + 450;
      if (near || e.x > L - 20 && e.x < Rt + 20 && fy > top - 40 && fy < truck.y + 10) {
        e.done = true;
        flyers.push({ kind: e.kind, fx: e.x, fy, t: 0 });
        sfx.rescue();
        popup('RESCUED!', e.x, fy - 150, '#2fae4a', 46);
        if (e.balloon) burst(e.x, e.y - 70, 10, [e.color, '#fff'], 250, 400, 6);
      }
    }
  }

  // water cannon spray
  if (fx.water && Math.random() < 0.9) for (let i = 0; i < 3; i++) particles.push({ x: wx + 90, y: truck.y - 112, vx: 700 + Math.random() * 200, vy: -150 + Math.random() * 120, life: 0.6, max: 0.6, color: i % 2 ? '#4cc9f0' : '#bfe9ff', size: 6, grav: 600 });
  if ((fx.plow || fx.blade) && truck.onGround && Math.random() < 0.6) burst(wx + 90, GROUND - 10, 1, curLevel.theme === 'snow' ? ['#fff'] : ['#c99a6a'], 200, 600, 6);

  for (const f of flyers) {
    f.t += dt * 1.6;
    if (f.t >= 1 && !f.arrived) {
      f.arrived = true; bed.push(f.kind); if (FRIENDS.includes(f.kind)) rescued++;
      burst(truckWX() + 34, truck.y - 110, 16, ['#ffcc00', '#ff6fae', '#5ec8ff', '#2fae4a'], 260, 500, 6);
      if (FRIENDS.includes(f.kind) && rescued < curLevel.goal.n) speak(['Great job!', 'You saved the ' + FRIEND_NAMES[f.kind] + '!', 'PawJam to the rescue!'][Math.floor(Math.random() * 3)]);
    }
  }
  flyers = flyers.filter(f => !f.arrived);

  const g = curLevel.goal;
  if (!ended && !['race', 'reach', 'freestyle'].includes(g.type) && progress() >= g.n) endLevel(true);

  if (boostHeld && Math.random() < 0.5) particles.push({ x: wx - 85, y: truck.y - 70, vx: -200, vy: -40, life: 0.3, max: 0.3, color: '#ff9a3c', size: 8, grav: -100 });

  if (engineGain && actx) {
    engineGain.gain.setTargetAtTime(muted ? 0 : 0.035, actx.currentTime, 0.1);
    engineOsc.frequency.setTargetAtTime(45 + v * 0.12 + (truck.onGround ? 0 : 25), actx.currentTime, 0.1);
  }
  updateFx(dt);
  updateHud();
}

function crash() {
  crashT = 0.8; fsCombo = 1; shake = 0.4; sfx.crash();
  popup('CRASH!', truckWX(), truck.y - 220, '#ff3b5c', 46);
  burst(truckWX(), GROUND - 40, 20, ['#c99a6a', '#555', '#ffcc00'], 360, 900, 8);
}
function dinoQuake(wx) {
  sfx.quake(); shake = 0.6;
  waves.push({ x: wx, r: 0, life: 0.6 });
  popup('DINO STOMP!', wx, GROUND - 260, '#8bc34a', 48);
  for (const e of entities) if (['boulder', 'tires', 'snowman', 'wall'].includes(e.t) && !e.broken && e.x > wx - 120 && e.x < wx + 520) smash(e, 'BOOM!');
  for (const e of entities) if (e.t === 'car' && !e.crushed && e.x > wx - 120 && e.x < wx + 360) { e.crushed = true; crushed++; sfx.crunch(); }
}

function updateFx(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 60 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
  for (const w of waves) { w.r += 900 * dt; w.life -= dt; }
  waves = waves.filter(w => w.life > 0);
  for (const p of confetti) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.r += p.vr * dt; }
  confetti = confetti.filter(p => p.y < H + offY + 40);
  if (state !== 'play' && engineGain && actx) engineGain.gain.setTargetAtTime(0, actx.currentTime, 0.1);
}

// ---------- Render ----------
function render() {
  const sx = shake > 0 ? (Math.random() - 0.5) * 16 * shake / 0.4 : 0, sy = shake > 0 ? (Math.random() - 0.5) * 12 * shake / 0.4 : 0;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, sx * scale * dpr, (offY + sy) * scale * dpr);
  drawBackground(ctx);
  if (offY > 150 && state === 'play') label(ctx, 'Turn sideways! 🔄', W / 2, -offY / 2, 44, '#fff', '#1f4fa8');
  const playing = state === 'play' || state === 'win' || state === 'fail';
  if (playing) {
    if (rival) {
      ctx.save(); ctx.translate(rival.x - camX, GROUND - 26); ctx.scale(0.78, 0.78);
      drawTruck(ctx, rival.pup, rival.truck, 0, 0, 0, rival.spin, 0, { t: time, alpha: 0.95 });
      ctx.restore();
    }
    const vis = e => e.x - camX < W + 260 && e.x + (e.w || 0) - camX > -360;
    for (const e of entities) if ((e.t === 'pit' || e.t === 'bridge' || e.t === 'loop') && vis(e)) drawEntity(ctx, e);
    for (const e of entities) if (!['pit', 'bridge', 'loop', 'bone'].includes(e.t) && vis(e)) drawEntity(ctx, e);
    for (const e of entities) if (e.t === 'bone' && !e.got && vis(e)) drawBone(ctx, e.x - camX, e.y, time + e.x);
    if (state === 'play') drawHints(ctx);
    for (const w of waves) { ctx.globalAlpha = w.life / 0.6; ctx.strokeStyle = '#8bc34a'; ctx.lineWidth = 10; ctx.beginPath(); ctx.ellipse(w.x - camX, GROUND, w.r, w.r * 0.25, 0, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
  }

  const flash = invuln > 0 && Math.floor(time * 12) % 2 === 0;
  if (!truck.falling && !loopRide) {
    const sh = Math.max(0.3, 1 - (GROUND - truck.y) / 400);
    ellipse(ctx, truck.sx, GROUND + 4, 90 * sh, 10 * sh, 'rgba(0,0,0,.25)');
  }
  if (state !== 'play' || !flash) {
    const fx = state === 'play' ? fxState() : {};
    const wob = crashT > 0 ? Math.sin(time * 40) * 0.15 : 0;
    drawTruck(ctx, pup, truckType, truck.sx, truck.y, truck.angle + trick.done + wob, truck.spin, truck.squash,
      { boost: boostHeld && state === 'play', fx, bed, t: time, blink: truck.blink, mud: mudLevel,
        flipX: donutT > 0 ? Math.cos((1 - donutT) * Math.PI * 4) : 1, glow: invincible() ? '#4cc9f0' : null });
  }
  if (loopRide) drawEntityFront(ctx, loopRide.e);

  if (playing) {
    for (const f of flyers) {
      const tx = truckWX() + 34, ty = truck.y - 100, k = Math.min(1, f.t);
      drawFriend(ctx, f.kind, f.fx + (tx - f.fx) * k - camX, f.fy + (ty - f.fy) * k - Math.sin(k * Math.PI) * 160, 1.1 - 0.5 * k, time);
    }
    for (const p of particles) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5)); circle(ctx, p.x - camX, p.y, p.size, p.color); }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      const s = p.size * (1 + Math.max(0, p.life - 0.9) * 3);
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.font = `900 ${s}px Trebuchet MS, Arial`;
      const half = ctx.measureText(p.text).width / 2 + 8;   // keep words on screen
      label(ctx, p.text, Math.max(half, Math.min(W - half, p.x - camX)), p.y, s, p.color);
    }
    ctx.globalAlpha = 1;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    drawHud(ctx);
  }
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  for (const p of confetti) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.color; ctx.fillRect(-6, -3, 12, 6); ctx.restore(); }
}
function drawEntityFront(c, e) {
  // front half of the loop so the truck looks inside it
  const cx = e.x - camX, cy = GROUND - e.r;
  c.save(); c.globalAlpha = 0.35; c.lineWidth = 22; c.strokeStyle = '#d64545'; c.beginPath(); c.arc(cx, cy, e.r + 10, 0.2, Math.PI - 0.2); c.stroke(); c.restore();
}

function drawHints(c) {
  if (!truck.onGround) return;
  const wx = truckWX();
  const e = entities.find(e => ['boulder', 'tires', 'pit', 'fire', 'snowman', 'wall', 'bridge'].includes(e.t) && !e.broken && e.x - wx > 110 && e.x - wx < (e.t === 'wall' ? 800 : 420));
  if (!e) return;
  let txt = null;
  if (e.t === 'wall') {
    if (canBreak(e)) txt = 'SMASH IT!';
    else if (team[1 - active].id === 'rubble' || ['nitro', 'blade', 'plow', 'dash', 'stomp'].includes(team[1 - active].ab.key)) txt = '📱 PUP PAD!';
    else if (SMASHERS.includes(ab()) || ab() === 'stomp') txt = 'SPECIAL!';
    else txt = 'TOO TALL!';
  } else if (curLevel.hints) txt = e.t === 'tires' ? 'JUMP x2!' : e.t === 'bridge' ? 'JUMP or WAIT!' : 'JUMP!';
  if (!txt) return;
  const x = e.x - camX + (e.w || 0) / 2, y = GROUND - Math.min(e.h || 0, 300) - 80 + Math.sin(time * 10) * 8;
  label(c, txt, x, y, 36, '#5fe07a');
  poly(c, [[x - 14, y + 24], [x + 14, y + 24], [x, y + 42]], '#5fe07a');
}

    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { c.fillStyle = (i + j) % 2 ? '#111' : '#fff'; c.fillRect(gx + bw - 36 + i * 7, 31 + j * 7, 7, 7); }
    if (rival) { circle(c, px(rival.x), 42, 12, '#1c1c1c'); circle(c, px(rival.x), 42, 6, '#3ddc4a'); }

    c.fillStyle = '#1f3b70'; c.font = '900 30px Trebuchet MS, Arial'; c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText(`${Math.min(progress(), g.n)}/${g.n}`, gx + 66, 43);
  }
  if (pup.id === 'rocky') {

    c.fillStyle = 'rgba(255,255,255,.92)'; rrect(c, rx, 12, 130, 58, 29); c.fill();

let hudCache = {};
function updateHud() {
  const fill = Math.round(charge[active] * 100);
  const ready = charge[active] >= 1 && abilityT <= 0;
  if (hudCache.fill !== fill || hudCache.ab !== pup.ab.icon || hudCache.active !== abilityT > 0) {

    $('specialIco').textContent = pup.ab.icon;

  }
  if (hudCache.ready !== ready) { $('specialBtn').classList.toggle('ready', ready); hudCache.ready = ready; }
  const wall = entities.some(e => e.t === 'wall' && !e.broken && e.x - truckWX() > 0 && e.x - truckWX() < 900) && !canBreak({ t: 'wall' });
  const hint = wall && swapCool <= 0;

function endLevel(won, why) {
  if (ended) return;
  ended = true; boostHeld = false; wheelieHeld = false;
  setTimeout(() => {
    if (state !== 'play') return;
    const before = totalStars();
    let stars = 0;
    if (mode === 'freestyle') {
      stars = FS_STARS.filter(s => fsScore >= s).length;
      const r = save.fs[arenaIdx] || {};
      const newBest = !r.best || fsScore > r.best;
      save.fs[arenaIdx] = { best: Math.max(r.best || 0, fsScore), stars: Math.max(r.stars || 0, stars) };
      persist();
      $('winTitle').textContent = newBest ? 'NEW HIGH SCORE!' : 'TIME UP!';
      $('winText').textContent = `${pup.name} scored ${fsScore} points! ${stars < 3 ? `Get ${FS_STARS[stars]} for the next star.` : 'Freestyle superstar!'}`;
      $('nextBtn').style.display = 'none';
      speak(newBest ? `New high score! ${fsScore} points!` : `${fsScore} points! Awesome!`);
    } else if (won) {
      stars = Math.max(1, hearts);
      save.stars[levelIdx] = Math.max(save.stars[levelIdx] || 0, stars);
      persist();
      const last = levelIdx === LEVELS.length - 1, g = curLevel.goal;
      $('winTitle').textContent = last ? 'PAWJAM CHAMPION!' : g.type === 'race' ? 'YOU WON THE RACE!' : g.type === 'reach' ? `${CITIZENS[g.who].toUpperCase()} IS SAFE!` : 'MISSION COMPLETE!';
      $('winText').textContent = last ? `🏆 ${pup.name} is the champion of Adventure Bay Stadium! 🏆` :
        stars === 3 ? 'Perfect! Not a single heart lost!' : `Great job! Finish with all ${MAX_HEARTS} hearts to earn 3 stars.`;
      $('nextBtn').style.display = last ? 'none' : '';
      speak(last ? 'You are the Paw Jam champion!' : g.type === 'reach' ? `You saved ${CITIZENS[g.who]}! Mission complete!` : 'Mission complete! Paw Jam is on a roll!');
    }
    if (mode === 'freestyle' || won) {
      const after = totalStars();
      const unlocked = TRUCKS.filter(t => t.need > before && t.need <= after);
      sfx.win();
      for (let i = 0; i < 140; i++) confetti.push({ x: Math.random() * W, y: -Math.random() * 300, vx: (Math.random() - 0.5) * 120, vy: 80 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 10, color: ['#ff4d6d', '#ffd23f', '#3bceac', '#7b5cff', '#4cc9f0', '#ff8c42'][i % 6] });
      $('winStars').innerHTML = [0, 1, 2].map(i => `<i class="${i < stars ? '' : 'off'}" style="animation-delay:${i * 0.15}s">⭐</i>`).join('');
      const un = $('winUnlock');
      if (unlocked.length) { un.style.display = ''; un.textContent = `🔓 New truck style unlocked: ${unlocked.map(t => t.name).join(', ')}! Visit the Garage.`; }
      else un.style.display = 'none';
      show('win');
    } else {
      sfx.lose();
      $('failIco').textContent = why === 'race' ? '🏁' : '💔';
      $('failText').textContent = why === 'race' ? 'The rival truck won the race!' : 'Out of hearts!';
      $('failTip').textContent = why === 'race' ? 'Hold TURBO and use your SPECIAL to go faster!' :
        curLevel.w.wall ? 'Use the PUP PAD 📱 to swap to Rubble before big walls!' : 'Jump over rocks, fire and holes. Tap JUMP twice for a double jump!';
      show('fail');
      speak("Oh no! Let's try again!");
    }
  }, won ? 900 : 1100);
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); ensureAudio(); jump(); }
  if (['ArrowRight', 'KeyD', 'ShiftLeft', 'ShiftRight'].includes(e.code)) boostHeld = state === 'play';
  if (e.code === 'KeyH') honk();
  if (e.code === 'KeyE' || e.code === 'KeyP') useSpecial();
  if (e.code === 'KeyQ' || e.code === 'Tab') { e.preventDefault(); swapPup(); }
  if (e.code === 'KeyF') trickPress();
  if (e.code === 'ArrowDown' || e.code === 'KeyS') wheelieHeld = state === 'play';
});
addEventListener('keyup', e => {
  if (['ArrowRight', 'KeyD', 'ShiftLeft', 'ShiftRight'].includes(e.code)) boostHeld = false;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') wheelieHeld = false;
});
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  if (state === 'garage') renderGaragePreview();
  render();
  requestAnimationFrame(frame);
}
show('title');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
